# ============================================================================
#  Netlify configuration — Smart Campus Lost and Found (spec §39)
# ============================================================================
#  Free tier only: a static Angular build, no server, no functions.
#
#  Build pipeline
#    1. npm ci                  → reproducible install from package-lock.json
#    2. scripts/set-env.mjs     → writes src/environments/environment.production.ts
#                                 from the SUPABASE_URL / SUPABASE_ANON_KEY
#                                 environment variables stored in Netlify
#    3. ng build --configuration production → dist/campus-lost-found/browser
#
#  Set the two variables in: Site configuration → Environment variables.
#  Never put the service_role key here: only the public anon key belongs in a
#  front-end build (Row Level Security is what protects the data).
# ============================================================================

[build]
  command = "node scripts/set-env.mjs --production && npm run build -- --configuration production"
  publish = "dist/campus-lost-found/browser"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# --- SPA fallback: Angular routes such as /items/<uuid> must not 404 --------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --- Security + caching headers --------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/chunk-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styles-*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- Preview deploys get a clear banner in the deploy log -------------------
[context.deploy-preview]
  command = "node scripts/set-env.mjs --production && npm run build -- --configuration production"
